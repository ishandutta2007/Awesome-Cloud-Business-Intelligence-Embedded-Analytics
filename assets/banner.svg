<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-10px) scale(1.03); opacity: 1; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.85); }
        50% { transform: scaleY(1.1); }
      }
      @keyframes lineDash {
        to { stroke-dashoffset: -40; }
      }
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 1;
      }
      .animated-bar {
        transform-origin: bottom;
        animation: barGrow 4s ease-in-out infinite alternate;
      }
      .animated-bar:nth-child(2) { animation-delay: 0.8s; }
      .animated-bar:nth-child(3) { animation-delay: 1.6s; }
      .animated-bar:nth-child(4) { animation-delay: 2.4s; }
      .chart-line {
        stroke-dasharray: 8 6;
        animation: lineDash 3s linear infinite;
      }
      .pill-card {
        animation: floatPulse 5s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: url(#titleGrad);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Dynamic Charts & Visual Elements (Subtle behind text) -->
  <g transform="translate(850, 120)" opacity="0.45">
    <rect class="animated-bar" x="0" y="50" width="35" height="150" rx="6" fill="url(#barGrad1)" />
    <rect class="animated-bar" x="50" y="20" width="35" height="180" rx="6" fill="url(#barGrad2)" />
    <rect class="animated-bar" x="100" y="90" width="35" height="110" rx="6" fill="url(#barGrad1)" />
    <rect class="animated-bar" x="150" y="10" width="35" height="190" rx="6" fill="url(#barGrad2)" />
    <path class="chart-line" d="M 17 120 Q 67 40 117 100 T 167 30" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Pills (Floating in background) -->
  <g class="pill-card" transform="translate(900, 60)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10b981"/>
    <text x="36" y="23" class="badge-text">Embedded Dashboards</text>
  </g>
  
  <g class="pill-card" transform="translate(750, 310)" style="animation-delay: 2.5s;">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#6366f1"/>
    <text x="36" y="23" class="badge-text">Semantic Layer Engine</text>
  </g>

  <!-- Main Foreground Content (Header & Title) -->
  <g transform="translate(80, 140)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="270" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" font-size="44" filter="url(#glow)">Awesome Cloud BI &amp;</text>
    <text x="0" y="130" class="title-text" font-size="44" filter="url(#glow)">Embedded Analytics 📊</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text" font-size="18">Commercial Platforms • Open-Source Engines • Semantic Layer Frameworks</text>
  </g>
</svg>
